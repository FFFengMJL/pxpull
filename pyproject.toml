[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pxpull"
version = "0.1.0"
description = "在 Linux/macOS 上原生解析 PxCook .pxcp 设计文件，并生成可点选的 HTML 查看器"
readme = "README.md"
authors = [{ name = "FFFengMJL" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pillow>=10.0"]
keywords = ["pxcook", "pxcp", "design", "ui", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
pxpull = "pxpull:main"

[project.urls]
Repository = "https://github.com/FFFengMJL/pxpull"
Issues = "https://github.com/FFFengMJL/pxpull/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
py-modules = ["pxpull", "pxpull_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 本地 CLI 工具：只启用通用正确性规则（E/F/W/I/UP/B/RUF）。
# 宽泛的 try/except 是解析未知版本文件时的刻意兜底，因此不启用 bandit(S/PLW) 规则。
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文全角标点/乘号是文档与 UI 文案的一部分
    "RUF046",  # int(round(n)) 中 n 已是 int，纯冗余
    "RUF057",
    "E501",    # 长行交给格式化器
]
